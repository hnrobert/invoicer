# pnpm workspace manifest. This isn't a monorepo; the file exists to allowlist
# native-build dependencies so pnpm doesn't prompt/skip their install scripts.
# pnpm v11 reads `allowBuilds` (a map of package -> bool).
allowBuilds:
  # better-sqlite3 v13+ ships N-API prebuilds INSIDE the package
  # (prebuilds/<platform>-<arch>.node, loaded at require time — no install
  # script). Allowing its "build" makes pnpm run node-gyp on the bundled
  # binding.gyp (npm legacy behavior), which needs python + a C toolchain and
  # fails in slim images. False is correct: the prebuilds are the runtime path.
  better-sqlite3: false
  esbuild: true
  "@parcel/watcher": true
  tesseract.js: true
  vue-demi: true
  # canvas is an optional transitive dep of tesseract.js (server-side image
  # preprocessing); we don't need it, so skip its heavy native build.
  canvas: false
minimumReleaseAgeExclude:
  - email-poster@0.3.4
