services:
  app:
    build: .
    ports:
      # External port: edit HERE (container port stays 10752 — it also feeds
      # PADDLEOCR_URL / BETTER_AUTH_URL defaults).
      - "10752:10752"
    volumes:
      # Persist the SQLite database and uploaded invoices across container rebuilds.
      - ./data:/app/data
      - ./uploads:/app/uploads
      # Expose the host timezone so timestamps/emails resolve in local time.
      - /etc/localtime:/etc/localtime:ro
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/app.db
      UPLOADS_DIR: /app/uploads
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Better Auth: ≥32-char secret (falls back to a dev-only value if unset).
      # Reuse SESSION_SECRET when it is long enough, else set BETTER_AUTH_SECRET.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${SESSION_SECRET:-invoicer-dev-better-auth-secret-replace-in-prod-0123456789}}
      BETTER_AUTH_URL: ${SITE_URL:-http://localhost:10752}
      SITE_URL: ${SITE_URL:-}
      # OAuth providers (optional — a provider is enabled only when both its
      # credentials are present). Both are built-in Better Auth providers.
      # GitHub OAuth App callback URL:
      #   ${SITE_URL}/api/auth/callback/github
      # WeChat Open Platform callback URL:
      #   ${SITE_URL}/api/auth/callback/wechat
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # PaddleOCR sidecar address ON THE COMPOSE NETWORK (see the `paddleocr`
      # service below — no host port is published). Enable with:
      #   docker compose --profile ocr up -d
      # and the app picks it up automatically (unreachable → tesseract fallback).
      PADDLEOCR_URL: ${PADDLEOCR_URL:-http://paddleocr:8080}
    restart: unless-stopped

  # PP-OCR sidecar (optional, profile "ocr" so the default stack stays light).
  # Reachable only over the compose-internal network — no host port exposed;
  # the app calls http://paddleocr:8080 (service-name DNS).
  # Official PaddleX serving image — POST /ocr with {file: <base64>, fileType: 1}.
  # Check https://github.com/PaddlePaddle/PaddleX/blob/release/3.x/docs/ for the
  # current image tag; this one tracks PaddleX 3.x.
  paddleocr:
    image: registry.baidubce.com/paddlex/paddlex-api:paddlex-3.2.1
    environment:
      # CPU-only PP-OCRv5 mobile models (small + fast); swap to server models
      # on a GPU host for the best accuracy.
      PADDLE_PDX_SERVER_HOST_PORT: 8080
      PADDLE_PDX_PIPELINE: OCR
      PADDLE_PDX_DEVICE: cpu
    restart: unless-stopped
    profiles: ["ocr"]
